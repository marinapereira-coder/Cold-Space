<script>
var APP_DATA=null;
var CURRENT_ROLE='';
var CURRENT_PAGE='home';
var CAMPAIGN_EDIT_ID=null;
var MODEL_TAB='manual';
var MANUAL_FIELDS=[];
var IMPORTED_FIELDS=[];
var RESPONSES_DATA=null;
var CHAT_DATA=null;
var CHAT_THREAD_ID=null;
var STORE_IMPORT_ROWS=[];
var STORE_IMPORT_PREVIEW=null;
var AUTH_MODE='';
var STORE_ACCESS_TOKEN='';
var STORE_REFRESH_TOKEN='';
var CALENDAR_DATA=null;
var CALENDAR_CURSOR=new Date();
var EVALUATION_DATA=null;
var ACCESS_DATA=null;

function applyTheme(theme){
  var dark=theme==='dark';
  document.body.classList.toggle('dark-mode',dark);
  var btn=document.getElementById('themeToggle');
  if(btn){
    btn.setAttribute('aria-checked',dark?'true':'false');
    btn.setAttribute('aria-label',dark?'Ativar modo claro':'Ativar modo escuro');
    var icon=btn.querySelector('.theme-toggle-icon');
    var label=btn.querySelector('.theme-toggle-label');
    if(icon)icon.textContent=dark?'☾':'☀';
    if(label)label.textContent=dark?'Escuro':'Claro';
  }
}
function initTheme(){
  var saved='';
  try{saved=localStorage.getItem('bacio-theme')||'';}catch(e){}
  applyTheme(saved==='dark'?'dark':'light');
}
function toggleTheme(){
  var next=document.body.classList.contains('dark-mode')?'light':'dark';
  applyTheme(next);
  try{localStorage.setItem('bacio-theme',next);}catch(e){}
}

window.addEventListener('load',function(){
  initTheme();
  try{bindEvents();}catch(e){showError('Erro ao iniciar a interface: '+(e.message||e));return;}
  if(typeof google==='undefined'||!google.script||!google.script.run){showError('O aplicativo foi aberto fora do ambiente do Google Apps Script.');return;}
  google.script.run
    .withSuccessHandler(handleEntryState)
    .withFailureHandler(function(error){showError(error&&error.message?error.message:String(error));})
    .getEntryBootstrap(window.BACIO_PORTAL_MODE||'escritorio');
});

function bindEvents(){
  document.addEventListener('click',function(e){
    var nav=e.target.closest('[data-page]');if(nav){showPage(nav.getAttribute('data-page'));}
    var close=e.target.closest('[data-close]');if(close){closeModal(close.getAttribute('data-close'));}
  });
  document.getElementById('mobileMenuBtn').onclick=function(){document.getElementById('sidebar').classList.toggle('open');};
  document.getElementById('themeToggle').onclick=toggleTheme;
  document.getElementById('notificationButton').onclick=function(e){e.stopPropagation();toggleNotificationPanel();};
  document.getElementById('notificationPanel').onclick=function(e){e.stopPropagation();};
  document.addEventListener('click',closeNotificationPanel);
  document.getElementById('markAllReadBtn').onclick=markAllNotificationsRead;

  document.getElementById('storeLoginBtn').onclick=doStoreLogin;
  document.getElementById('storeLoginPassword').addEventListener('keydown',function(e){if(e.key==='Enter'){doStoreLogin();}});
  document.getElementById('storeChangePasswordBtn').onclick=doStorePasswordChange;

  document.getElementById('agendaFilter').onchange=renderAgenda;
  document.getElementById('prevMonthBtn').onclick=function(){CALENDAR_CURSOR=new Date(CALENDAR_CURSOR.getFullYear(),CALENDAR_CURSOR.getMonth()-1,1);renderMonthCalendar();};
  document.getElementById('nextMonthBtn').onclick=function(){CALENDAR_CURSOR=new Date(CALENDAR_CURSOR.getFullYear(),CALENDAR_CURSOR.getMonth()+1,1);renderMonthCalendar();};
  document.getElementById('todayMonthBtn').onclick=function(){CALENDAR_CURSOR=new Date();renderMonthCalendar();};
  document.getElementById('newCalendarEventBtn').onclick=openCalendarEventModal;

  ['campaignSearch','campaignTypeFilter','campaignStatusFilter'].forEach(function(id){document.getElementById(id).addEventListener('input',renderCampaignManagement);});
  ['noticeSearch','noticeTypeFilter'].forEach(function(id){document.getElementById(id).addEventListener('input',renderNotices);});
  ['storeSearch','storeRegionalFilter','storeConsultorFilter'].forEach(function(id){document.getElementById(id).addEventListener('input',renderStores);});
  ['responseSearch','responseStatusFilter','responseDemandFilter'].forEach(function(id){document.getElementById(id).addEventListener('input',renderResponses);});
  ['evaluationSearch','evaluationStoreFilter'].forEach(function(id){document.getElementById(id).addEventListener('input',renderEvaluations);});
  ['accessSearch','accessStatusFilter'].forEach(function(id){document.getElementById(id).addEventListener('input',renderAccesses);});

  document.getElementById('newDemandBtn').onclick=function(){openCampaignModal('demanda');};
  document.getElementById('newCampaignBtn').onclick=function(){openCampaignModal('campanha');};
  document.getElementById('fDepartment').onchange=refreshRequestCategories;
  document.getElementById('fRequestCategory').onchange=syncRequestLegacyType;
  document.getElementById('campaignDepartmentFilter').onchange=renderCampaignManagement;
  document.getElementById('saveCampaignBtn').onclick=saveCampaign;
  document.getElementById('addQuestionBtn').onclick=function(){addManualQuestion();};
  document.querySelectorAll('[data-model-tab]').forEach(function(btn){btn.onclick=function(){setModelTab(btn.getAttribute('data-model-tab'));};});
  document.getElementById('fAudience').onchange=toggleStorePicker;
  document.getElementById('fAudienceGroup').onchange=renderAudienceRouting;
  document.getElementById('storePickerSearch').oninput=renderStorePicker;
  document.getElementById('formSpreadsheet').onchange=handleFormSpreadsheet;

  document.getElementById('newNoticeBtn').onclick=openNoticeModal;
  document.getElementById('addStoreBtn').onclick=openStoreModal;
  document.getElementById('importStoresBtn').onclick=openStoreImportModal;
  document.getElementById('storesSpreadsheet').onchange=handleStoresSpreadsheet;
  document.getElementById('applyStoreImportBtn').onclick=applyStoreImport;

  document.getElementById('refreshResponsesBtn').onclick=loadResponses;
  document.getElementById('refreshEvaluationsBtn').onclick=loadEvaluations;
  document.getElementById('refreshAccessBtn').onclick=loadAccesses;
  document.getElementById('newStoreAccessBtn').onclick=openUnifiedAccess;
  document.getElementById('refreshChatBtn').onclick=loadChatWorkspace;
  document.getElementById('chatThreadSearch').oninput=renderChatThreads;
  document.getElementById('sendChatBtn').onclick=sendChatMessage;
  document.getElementById('chatText').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChatMessage();}});
}

function startApp(data){
  try{
    APP_DATA=data||{};
    CURRENT_ROLE=String((APP_DATA.user||{}).role||'').toLowerCase();
    AUTH_MODE=APP_DATA.authMode||AUTH_MODE||'corporate';
    document.getElementById('loading').style.display='none';
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    var user=APP_DATA.user||{},nome=user.nome||'Usuário Bacio',first=nome.split(' ')[0];
    document.getElementById('sideName').textContent=nome;
    document.getElementById('sideContext').textContent=user.contexto||'';
    document.getElementById('topName').textContent=first;
    document.getElementById('welcomeTitle').textContent=saudacao()+', '+first+'.';
    document.getElementById('welcomeSubtitle').textContent=Number((APP_DATA.summary||{}).pending||0)>0?'Veja o que precisa da sua atenção hoje.':'Tudo em dia por aqui.';
    document.getElementById('weather').textContent=(APP_DATA.weather||{}).city||'';

    var passwordDepartment=AUTH_MODE==='store'&&CURRENT_ROLE!=='loja';
    if(CURRENT_ROLE!=='admin')CAMPAIGN_PREVIEW_DEPARTMENT='';
    document.getElementById('managementMenu').style.display=CURRENT_ROLE==='loja'?'none':'block';
    document.querySelectorAll('.nav-btn[data-page]').forEach(function(nav){
      var page=nav.getAttribute('data-page');
      if(passwordDepartment)nav.style.display=['home','campanhas','respostas'].indexOf(page)>=0?'':'none';
      else nav.style.display='';
    });
    document.getElementById('switchProfileLoginBtn').style.display=CURRENT_ROLE==='admin'?'inline-flex':'none';
    document.getElementById('campaignAdminActions').style.display=(CURRENT_ROLE==='admin'||['marketing','rh','qualidade','treinamento','comercial','growth','ti','departamento'].indexOf(CURRENT_ROLE)>=0)?'flex':'none';
    document.getElementById('noticeAdminActions').style.display=CURRENT_ROLE==='admin'?'flex':'none';
    document.getElementById('storeAdminActions').style.display=CURRENT_ROLE==='admin'?'flex':'none';
    document.getElementById('accessNavBtn').style.display=CURRENT_ROLE==='admin'?'flex':'none';
    document.getElementById('newCalendarEventBtn').style.display=CURRENT_ROLE==='admin'?'inline-block':'none';
    document.getElementById('evaluationPageTitle').textContent=CURRENT_ROLE==='loja'?'Minhas Avaliações':'Avaliações';
    document.getElementById('evaluationPageSubtitle').textContent=CURRENT_ROLE==='loja'?'Acompanhe suas notas, SLA e feedbacks do escritório.':'Nota, SLA e histórico das entregas das lojas.';
    document.getElementById('evaluationManagementFilters').style.display=CURRENT_ROLE==='loja'?'none':'grid';

    CALENDAR_DATA=null;EVALUATION_DATA=null;ACCESS_DATA=null;CHAT_DATA=null;RESPONSES_DATA=null;
    renderAllCore();
  }catch(error){showError('Erro ao montar a interface: '+error.message);}
}

function renderAllCore(){
  renderHome();renderAgenda();renderCampaignManagement();renderNotices();renderStores();renderNotifications();populateStoreFilters();renderStorePicker();
}

function showPage(page){
  if(AUTH_MODE==='store'&&CURRENT_ROLE!=='loja'&&['home','campanhas','respostas'].indexOf(page)<0){
    showToast('Essa área ainda não está habilitada para o perfil de departamento.');return;
  }
  var target=document.getElementById('page-'+page);if(!target)return;
  if(page==='acessos'&&CURRENT_ROLE!=='admin'){showToast('Área exclusiva para administradores.');return;}
  if(page==='respostas'&&CURRENT_ROLE==='loja'){showToast('Esta área é da gestão.');return;}
  CURRENT_PAGE=page;
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});target.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(function(n){n.classList.toggle('active',n.getAttribute('data-page')===page);});
  var titles={home:'Bacio Conecta',agenda:'Agenda',calendario:'Calendário',campanhas:'Central de Solicitações',comunicados:'Comunicados',central:'Central de Operações',chat:'Chat',respostas:'Respostas das Lojas',avaliacoes:'Avaliações',lojas:'Lojas & Estrutura',acessos:'Usuários & Acessos'};
  document.getElementById('topbarTitle').textContent=titles[page]||'Bacio Conecta';
  document.getElementById('sidebar').classList.remove('open');closeNotificationPanel();
  if(page==='respostas'&&CURRENT_ROLE!=='loja'&&!RESPONSES_DATA)loadResponses();if(page==='respostas')renderTestResponses();
  if(page==='avaliacoes'&&!EVALUATION_DATA)loadEvaluations();
  if(page==='calendario'&&!CALENDAR_DATA)loadCalendar();
  if(page==='chat'&&!CHAT_DATA)loadChatWorkspace();
  if(page==='acessos'&&CURRENT_ROLE==='admin'&&!ACCESS_DATA)loadAccesses();
  if(page==='lojas')renderStores();if(page==='agenda')renderAgenda();if(page==='comunicados')renderNotices();if(page==='central')renderCentralOperations();
  window.scrollTo(0,0);
}

function renderHome(){
  var s=APP_DATA.summary||{};
  document.getElementById('homeSummary').innerHTML=[
    [s.pending||0,'ações pendentes'],[s.dueToday||0,'vence hoje'],[s.campaigns||0,'campanhas ativas'],[s.unread||0,'novos alertas']
  ].map(function(x){return '<div class="summary-item"><span class="summary-number">'+x[0]+'</span><span class="summary-text">'+x[1]+'</span></div>';}).join('');
  var tasks=(APP_DATA.tasks||[]).slice(0,4);
  document.getElementById('taskList').innerHTML=tasks.length?tasks.map(function(t){return '<div class="task"><div><span class="task-type">'+safe(typeLabel(t.type))+'</span><h4>'+safe(t.title)+'</h4><p>'+safe(t.description)+'</p></div><div class="task-meta"><strong>'+safe(t.deadlineLabel||'Sem prazo')+'</strong><span>'+safe(t.statusLabel||timelineLabel(t.timelineStatus))+'</span></div><div><button class="btn primary" onclick="openDemandDetail(\''+safeJs(t.id)+'\')">'+safe(t.actionLabel||'Abrir')+'</button></div></div>';}).join(''):'<div class="empty"><strong>Nenhuma pendência</strong>Tudo em dia por aqui.</div>';
  var campaigns=(APP_DATA.campaigns||[]).slice(0,2);
  document.getElementById('homeCampaigns').innerHTML=campaigns.length?campaigns.map(function(c){var p=Math.max(0,Math.min(100,Number(c.progress||0)));return '<div class="campaign-card" onclick="openDemandDetail(\''+safeJs(c.id)+'\')"><div><span class="eyebrow" style="color:#f3d8b2">'+safe(c.deadlineLabel||'Campanha')+'</span><h4>'+safe(c.title)+'</h4><p>'+safe(c.description)+'</p><div class="progress"><span style="width:'+p+'%"></span></div><div class="progress-label">'+safe(c.progressLabel||p+'% concluído')+'</div></div></div>';}).join(''):'<div class="empty">Nenhuma campanha em andamento.</div>';
  document.getElementById('homeAnnouncements').innerHTML=(APP_DATA.announcements||[]).slice(0,3).map(announcementHtml).join('')||'<div class="empty">Nenhum comunicado recente.</div>';
}
function renderAgenda(){
  var list=(APP_DATA.managementItems||[]).slice();var f=document.getElementById('agendaFilter').value;
  if(f!=='all')list=list.filter(function(i){return String(i.timelineStatus||'active')===f;});
  list.sort(function(a,b){return String((a.timeline||{}).deadline||a.deadline||'9999').localeCompare(String((b.timeline||{}).deadline||b.deadline||'9999'));});
  var all=APP_DATA.managementItems||[];
  document.getElementById('agendaSummary').innerHTML=[
    [all.filter(function(i){return i.timelineStatus==='due_today';}).length,'Vence hoje'],[all.filter(function(i){return i.timelineStatus==='late';}).length,'Em atraso'],[all.filter(function(i){return i.timelineStatus==='scheduled';}).length,'Agendadas'],[all.filter(function(i){return i.timelineStatus==='completed';}).length,'Concluídas']
  ].map(kpiHtml).join('');
  if(!list.length){document.getElementById('agendaList').innerHTML='<div class="empty"><strong>Nenhum item</strong>Não há compromissos com esse filtro.</div>';return;}
  var grouped={};list.forEach(function(i){var d=(i.timeline||{}).deadline||i.deadline||'';var key=d?dateKey(d):'Sem prazo';(grouped[key]=grouped[key]||[]).push(i);});
  document.getElementById('agendaList').innerHTML='<div class="calendar">'+Object.keys(grouped).sort().map(function(key){var items=grouped[key],first=items[0],raw=(first.timeline||{}).deadline||first.deadline||'';var day=raw?formatDate(raw):'Sem prazo';var time=raw?formatTime(raw):'';return '<div class="calendar-row"><div class="calendar-day"><strong>'+safe(day)+'</strong><span>'+safe(time)+'</span></div><div class="calendar-items">'+items.map(function(i){return '<div class="calendar-event" onclick="openDemandDetail(\''+safeJs(i.id)+'\')"><strong>'+safe(i.title)+'</strong><span>'+safe(typeLabel(i.type))+' · '+safe(i.timelineLabel||timelineLabel(i.timelineStatus))+'</span></div>';}).join('')+'</div></div>';}).join('')+'</div>';
}


// Taxonomia da Central de Solicitações. Mantém 'campanha'/'demanda' para compatibilidade
// com os cadastros, importação de planilhas e fluxos já existentes.
var REQUEST_DEPARTMENTS={
 'Operações':['Demanda geral','Campanha','Comunicado operacional','Coleta de informações','Orientação para lojas'],
 'Marketing':['Campanha','Lançamento de produto','Material de comunicação','Pesquisa'],
 'Growth':['Campanha','Ação de fidelidade','Pesquisa'],
 'Qualidade':['Auditoria','Coleta de evidências','Orientação de qualidade'],
 'Treinamento':['Treinamento','Material educativo','Avaliação'],
 'Comercial':['Campanha','Ação comercial','Coleta de informações'],
 'TI':['Suporte técnico','Incidente','Atualização de sistema'],
 'RH':['Pesquisa','Comunicado','Treinamento']
};
function requestDepartment(item){return item.departamento||item.department||(item.cronograma||{}).departamentoSolicitante||'Operações';}
function populateRequestDepartments(){
 var el=document.getElementById('fDepartment');
 el.innerHTML=Object.keys(REQUEST_DEPARTMENTS).map(function(d){return '<option value="'+safe(d)+'">'+safe(d)+'</option>';}).join('');
}
function refreshRequestCategories(){
 var dept=document.getElementById('fDepartment').value;
 var el=document.getElementById('fRequestCategory'),previous=el.value;
 el.innerHTML=(REQUEST_DEPARTMENTS[dept]||['Demanda geral']).map(function(t){return '<option value="'+safe(t)+'">'+safe(t)+'</option>';}).join('');
 if((REQUEST_DEPARTMENTS[dept]||[]).indexOf(previous)>=0)el.value=previous;
 syncRequestLegacyType();
}
function syncRequestLegacyType(){
 document.getElementById('fType').value=document.getElementById('fRequestCategory').value==='Campanha'?'campanha':'demanda';
}
function populateDepartmentFilter(){
 var el=document.getElementById('campaignDepartmentFilter'),old=el.value||'all';
 if(el.options.length>1)return;
 el.innerHTML='<option value="all">Todos os departamentos</option>'+Object.keys(REQUEST_DEPARTMENTS).map(function(d){return '<option value="'+safe(d)+'">'+safe(d)+'</option>';}).join('');
 el.value=old;
}

function approveDepartmentRequest(id){
 if(CURRENT_ROLE!=='admin')return;
 if(!confirm('Aprovar e publicar esta solicitação para os destinatários?'))return;
 google.script.run.withSuccessHandler(function(){showToast('Solicitação aprovada e publicada.');refreshBootstrap('campanhas');})
 .withFailureHandler(serverError).setDemandStatus(id,'active');
}
var CAMPAIGN_PREVIEW_DEPARTMENT='';
function setDepartmentPreview(value){
 CAMPAIGN_PREVIEW_DEPARTMENT=CURRENT_ROLE==='admin'?String(value||''):'';
 CAMPAIGN_WORKSPACE_VIEW='all';
 document.getElementById('campaignDepartmentFilter').value='all';
 renderCampaignManagement();
}
var CAMPAIGN_WORKSPACE_VIEW='all';
function setCampaignWorkspaceView(view){CAMPAIGN_WORKSPACE_VIEW=view;renderCampaignManagement();}
function campaignWorkspaceTabs(){
 var role=CAMPAIGN_PREVIEW_DEPARTMENT?'departamento':CURRENT_ROLE,views=role==='loja'?[['all','Recebidas'],['pending','Para responder'],['finished','Respondidas']]:
 [['all','Todas'],['pending_approval','Aguardando aprovação'],['active','Em andamento'],['attention','Precisam de atenção'],['finished','Concluídas'],['draft','Rascunhos']];
 var host=document.getElementById('campaignWorkspaceTabs');
 host.innerHTML=views.map(function(pair){return '<button type="button" class="btn '+(CAMPAIGN_WORKSPACE_VIEW===pair[0]?'primary':'soft')+'" onclick="setCampaignWorkspaceView(\''+pair[0]+'\')">'+pair[1]+'</button>';}).join('');
 var help=document.getElementById('campaignWorkspaceDescription');
 help.textContent=CAMPAIGN_PREVIEW_DEPARTMENT?'Prévia de '+CAMPAIGN_PREVIEW_DEPARTMENT+' — dados filtrados, sem trocar o login.':role==='loja'?'Solicitações destinadas à sua loja, organizadas por andamento e prazo.':
 'Acompanhe cada departamento, status e prazo. A visibilidade continua limitada às permissões atuais do usuário.';
}
function renderCampaignManagement(){
 populateDepartmentFilter();
 var items=(APP_DATA.managementItems||[]).filter(function(i){return String(i.type||'').toLowerCase()!=='comunicado';});
 if(['marketing','rh','qualidade','treinamento','comercial','growth','ti','departamento'].indexOf(CURRENT_ROLE)>=0){
   var dept=String((APP_DATA.user||{}).departamento||CURRENT_ROLE).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
   items=items.filter(function(item){
     return String(requestDepartment(item)).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')===dept;
   });
 }
 var previewBar=document.getElementById('departmentPreviewBar');
 if(previewBar)previewBar.style.display=CURRENT_ROLE==='admin'?'block':'none';
 var adminActions=document.getElementById('campaignAdminActions');
 if(adminActions && CURRENT_ROLE==='admin')adminActions.style.display=CAMPAIGN_PREVIEW_DEPARTMENT?'none':'flex';
 campaignWorkspaceTabs();
 var q=(document.getElementById('campaignSearch').value||'').toLowerCase().trim(),t=document.getElementById('campaignTypeFilter').value;
 var status=document.getElementById('campaignStatusFilter').value,depFilter=document.getElementById('campaignDepartmentFilter').value;
 if(CURRENT_ROLE==='admin'&&CAMPAIGN_PREVIEW_DEPARTMENT)items=items.filter(function(i){return requestDepartment(i).toLowerCase()===CAMPAIGN_PREVIEW_DEPARTMENT.toLowerCase();});
 var filtered=items.filter(function(i){
  var text=((i.title||'')+' '+(i.description||'')).toLowerCase(),st=String(i.timelineStatus||i.status||'');
  var view=CAMPAIGN_WORKSPACE_VIEW;
  var matchesView=view==='all'||(view==='pending_approval'&&st==='pending_approval')||(view==='active'&&st==='active')||(view==='pending'&&st!=='completed'&&st!=='closed')||
    (view==='attention'&&(st==='late'||st==='due_today'))||(view==='finished'&&(st==='completed'||st==='closed'))||
    (view==='draft'&&(st==='draft'||st==='pending_approval'));
  return matchesView&&(!q||text.indexOf(q)>=0)&&(t==='all'||String(i.type)===t)&&
   (status==='all'||st===status)&&(depFilter==='all'||requestDepartment(i)===depFilter);
 });
 document.getElementById('campaignKpis').innerHTML=[
  [items.length,'Total de solicitações'],
  [items.filter(function(i){return i.timelineStatus==='active';}).length,'Em andamento'],
  [items.filter(function(i){return i.timelineStatus==='late'||i.timelineStatus==='due_today';}).length,'Precisam de atenção'],
  [items.filter(function(i){return i.timelineStatus==='completed'||i.timelineStatus==='closed';}).length,'Concluídas']
 ].map(kpiHtml).join('');
 var depts={};
 items.forEach(function(item){var d=requestDepartment(item);depts[d]=(depts[d]||0)+1;});
 document.getElementById('campaignDepartmentsSummary').innerHTML=
  Object.keys(depts).sort().map(function(dept){
   return '<button type="button" class="campaign-dept-card '+(depFilter===dept?'selected':'')+
    '" onclick="document.getElementById(\'campaignDepartmentFilter\').value=\''+safeJs(dept)+
    '\';renderCampaignManagement()"><strong>'+safe(dept)+'</strong><span>'+depts[dept]+' solicitações</span></button>';
  }).join('');
 var header='<div class="row header"><div>Solicitação / Departamento</div><div>Tipo</div><div>Status</div><div>Prazo</div><div>Respostas</div></div>';
 document.getElementById('campaignTable').innerHTML=header+(filtered.length?filtered.map(function(item){
  var st=item.timelineStatus||item.status||'active';
  return '<div class="row"><div><h4>'+safe(item.title)+'</h4><div class="muted">'+safe(requestDepartment(item))+
   ' · '+safe(item.description||'')+'</div></div><div class="muted">'+safe(typeLabel(item.type))+'</div><div><span class="status '+
   safe(st)+'">'+safe(item.timelineLabel||timelineLabel(st))+'</span></div><div class="muted">'+
   safe(formatDateTime((item.timeline||{}).deadline||item.deadline)||'Sem prazo')+'</div><div><button class="btn soft" onclick="openDemandDetail(\''+
   safeJs(item.id)+'\')">Ver detalhes · '+safe(item.progressLabel||'Acompanhar')+'</button>'+
    (CURRENT_ROLE==='admin'&&!CAMPAIGN_PREVIEW_DEPARTMENT&&item.publishStatus==='draft'&&(item.cronograma||{}).aprovacaoStatus==='pendente'?
    '<button class="btn primary" style="margin-left:6px" onclick="approveDepartmentRequest(\''+safeJs(item.id)+'\')">Aprovar e publicar</button>':'')+'</div></div>';
 }).join(''):'<div class="empty">Nenhuma solicitação encontrada com esses filtros.</div>');
}

function renderNotices(){
  var q=(document.getElementById('noticeSearch').value||'').toLowerCase().trim(),f=document.getElementById('noticeTypeFilter').value;
  var list=(APP_DATA.announcements||[]).filter(function(n){var text=((n.title||'')+' '+(n.excerpt||'')).toLowerCase();return (!q||text.indexOf(q)>=0)&&(f==='all'||String(n.kind||'info')===f);});
  document.getElementById('noticeList').innerHTML=list.length?list.map(announcementHtml).join(''):'<div class="empty"><strong>Nenhum comunicado</strong>Não há comunicados com esse filtro.</div>';
}
function announcementHtml(n){return '<div class="announcement '+safe(n.kind||'info')+'"><div class="announcement-type">'+safe(n.kindLabel||'Informativo')+'</div><div><h4>'+safe(n.title)+'</h4><p>'+safe(n.excerpt)+'</p></div><div class="announcement-date">'+safe(n.dateLabel||'')+'</div></div>';}

function populateStoreFilters(){
  var stores=APP_DATA.stores||[],regionals={},consultors={};stores.forEach(function(s){if(s.regional)regionals[s.regional]=1;if(s.consultor)consultors[s.consultor]=1;});
  setSelectOptions('storeRegionalFilter','Todas as regionais',Object.keys(regionals).sort());setSelectOptions('storeConsultorFilter','Todos os consultores',Object.keys(consultors).sort());
}

function parseMultiSheetCampaign(file,done,fail){
 var reader=new FileReader();
 reader.onload=function(e){try{
  if(typeof XLSX==='undefined')throw new Error('Leitor XLSX indisponível');
  var wb=XLSX.read(e.target.result,{type:'array',raw:false});
  var perStore={},sections=[],source=[],editableFields={},editableOrder=[];
  wb.SheetNames.forEach(function(name){
   if(/base\s*(lojas|adm)/i.test(name))return;
   var rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false});
   if(rows.length<4)return;
   var titles=rows[1]||[],units=rows[2]||[],count=0;
   var last=Math.max(titles.length,units.length);
   for(var ri=3;ri<rows.length;ri++){
    var row=rows[ri]||[],label=String(row[0]||'');
    // Alguns modelos possuem colunas iniciais vazias/mescladas: localizar o código LJ nas primeiras colunas.
    var storeCell=row.slice(0,Math.min(5,row.length)).map(function(v){return String(v==null?'':v);}).find(function(v){return /LJ\s*\d+/i.test(v);})||label;
    var matches=storeCell.match(/LJ\s*\d{1,5}/gi)||[];
    var codes=matches.map(function(value){var m=value.match(/LJ\s*0*(\d{1,5})/i);return m?('0000'+m[1]).slice(-4):'';}).filter(Boolean);
    if(!codes.length)continue;
    var fields=[];
    for(var ci=1;ci<last;ci++){
     var value=row[ci];
     var labelText=String(titles[ci]||units[ci]||('Coluna '+(ci+1))).trim();
     var isAnswerColumn=/plaquinhas|insumos recebidos|observac/.test(normalizeHeader(labelText));
     if((value==null||String(value).trim()==='')&&!isAnswerColumn)continue;
     if(!labelText)continue;
     var normalized=normalizeHeader(labelText);
     var editable=/plaquinhas|insumos recebidos|observac/.test(normalized);
     var fieldId='import_'+normalizeHeader(name).replace(/ /g,'_')+'_'+ci;
     if(editable){
       if(!editableFields[fieldId]){
         var isObs=/observac/.test(normalized);
         editableFields[fieldId]={id:fieldId,label:name+' — '+labelText,type:isObs?'textarea':'boolean',required:false,options:[]};
         editableOrder.push(fieldId);
       }
       // A resposta real da loja deve iniciar em branco, mesmo se a planilha possuir "Não".
       fields.push({label:labelText,unit:'',value:String(value),editable:true,fieldId:fieldId});
     }else fields.push({label:labelText,unit:String(units[ci]||'').trim(),value:String(value)});
    }
    codes.forEach(function(code){if(!perStore[code])perStore[code]=[];perStore[code].push({sheet:name,store:label,fields:fields});});
    count++;
   }
   if(count){source.push({sheet:name,rows:count});}
  });
  if(!Object.keys(perStore).length)throw new Error('Nenhuma loja identificada. Abas lidas: '+wb.SheetNames.join(' / ')+'. Verifique se as lojas estão identificadas com LJ e se a planilha possui registros a partir da quarta linha.');
  done({version:2,fileName:file.name,perStore:perStore,sheets:source,responseFields:editableOrder.map(function(id){return editableFields[id];})});
 }catch(err){fail(err);}};
 reader.onerror=function(){fail(new Error('Falha ao ler planilha'));};
 reader.readAsArrayBuffer(file);
}

function requestFieldsForStore(fields,sections){

 });
}

function simulateStoreResponse(){
 var host=document.getElementById('storeResponsePreviewForm'),result=document.getElementById('storeResponsePreviewResult');

 var answers={},missing=[];
 host.querySelectorAll('.answer-input').forEach(function(el){
  var value=String(el.value||'').trim();

  answers[el.dataset.key]=value;

  storeId:store.id,storeLabel:store.label,createdAt:new Date().toISOString(),status:'respondido',
  answers:answers,observacao:observation,modelFields:requestFieldsForStore(d.modelFields||[],d.importMeta&&d.importMeta.perStore&&d.importMeta.perStore[store.code]||[]),
  evaluation:null};
 BACIO_TEST_RESPONSES.unshift(item);
 renderTestResponses();
 result.innerHTML='<div class="response-status-note"><strong>Resposta de teste registrada!</strong> A resposta da '+safe(store.label)+' está disponível em Respostas das Lojas → Respostas simuladas. Os dados oficiais não foram alterados.</div>'+
 '<button type="button" class="btn primary" style="margin-top:12px" onclick="openSimulatedResponses()">Ver resposta enviada no teste</button>';

function responseInput(f,current){var req=f.required?' data-required="1"':'',val=current==null?'':String(current);if(f.type==='textarea')return '<textarea class="textarea answer-input" data-key="'+safe(f.id)+'"'+req+'>'+safe(val)+'</textarea>';if(f.type==='boolean')return '<select class="select answer-input" data-key="'+safe(f.id)+'"'+req+'><option value="">Selecione</option><option value="Sim" '+(val==='Sim'?'selected':'')+'>Sim</option><option value="Não" '+(val==='Não'?'selected':'')+'>Não</option></select>';if(f.type==='select')return '<select class="select answer-input" data-key="'+safe(f.id)+'"'+req+'><option value="">Selecione</option>'+(f.options||[]).map(function(o){return '<option value="'+safe(o)+'" '+(val===String(o)?'selected':'')+'>'+safe(o)+'</option>';}).join('')+'</select>';return '<input class="field answer-input" data-key="'+safe(f.id)+'"'+req+' type="'+(f.type==='number'?'number':f.type==='date'?'date':'text')+'" value="'+safe(val)+'">';}
function submitStoreResponse(demandaId){
  var answers={},missing=false;
  document.querySelectorAll('#storeResponseForm .answer-input').forEach(function(el){answers[el.dataset.key]=el.value;if(el.getAttribute('data-required')==='1'&&!String(el.value||'').trim())missing=true;});
  if(missing){showToast('Preencha todas as perguntas obrigatórias.');return;}
  var payload={demandaId:demandaId,lojaId:(APP_DATA.user||{}).lojaId,answers:answers,observacao:(document.getElementById('storeResponseObs')||{}).value||'',status:'respondido'};
  var ok=function(){showToast('Resposta enviada.');closeModal('detailModal');refreshBootstrap('campanhas');};

  if(AUTH_MODE==='store')run.submitStoreDemandResponse(STORE_ACCESS_TOKEN,payload);else run.submitDemandResponse(payload);
}

function renderEvaluations(){if(!EVALUATION_DATA){loadEvaluations();return;}var sum=EVALUATION_DATA.summary||{};document.getElementById('evaluationKpis').innerHTML=[[sum.total||0,'Avaliações'],[sum.avgStars||0,'Média de estrelas'],[sum.slaRate==null?0:sum.slaRate,'SLA cumprido %'],[sum.approved||0,'Aprovadas']].map(kpiHtml).join('');var q=(document.getElementById('evaluationSearch').value||'').toLowerCase().trim(),storeFilter=document.getElementById('evaluationStoreFilter').value;var stores=((EVALUATION_DATA||{}).stores||[]).filter(function(s){return (!q||s.storeLabel.toLowerCase().indexOf(q)>=0)&&(storeFilter==='all'||String(s.storeId)===storeFilter);});document.getElementById('evaluationStores').innerHTML=stores.map(function(s){return '<div class="evaluation-store-card"><h4>'+safe(s.storeLabel)+'</h4><div class="evaluation-score">'+safe(s.avgStars)+' <span>/ 5</span></div><div class="stars">'+starsText(s.avgStars)+'</div><div class="eval-meta"><div><strong>'+(s.slaRate==null?'—':s.slaRate+'%')+'</strong><span>SLA cumprido</span></div><div><strong>'+s.total+'</strong><span>avaliadas</span></div><div><strong>'+s.approved+'</strong><span>aprovadas</span></div><div><strong>'+s.adjustment+'</strong><span>ajustes</span></div></div></div>';}).join('')||'<div class="empty">Nenhuma avaliação ainda.</div>';var items=((EVALUATION_DATA||{}).items||[]).filter(function(i){var text=((i.storeLabel||'')+' '+(i.demandTitle||'')).toLowerCase();return (!q||text.indexOf(q)>=0)&&(storeFilter==='all'||String(i.storeId)===storeFilter);});document.getElementById('evaluationHistory').innerHTML='<div class="row header"><div>Loja / Demanda</div><div>Nota</div><div>SLA</div><div>Resultado</div><div>Data</div></div>'+(items.map(function(i){return '<div class="row"><div><h4>'+safe(i.storeLabel)+'</h4><div class="muted">'+safe(i.demandTitle)+(i.comment?' · '+safe(i.comment):'')+'</div></div><div><span class="stars">'+starsText(i.stars)+'</span></div><div><span class="'+(i.slaMet===true?'sla-ok':i.slaMet===false?'sla-late':'muted')+'">'+(i.slaMet===true?'No prazo':i.slaMet===false?'Fora do prazo':'Sem SLA')+'</span></div><div><span class="status '+safe(i.status)+'">'+safe(responseStatusLabel(i.status))+'</span></div><div class="muted">'+safe(formatDateTime(i.evaluatedAt))+'</div></div>';}).join('')||'<div class="empty">Nenhuma avaliação encontrada.</div>');}
function starsText(value){var n=Math.round(Number(value||0)),out='';for(var i=1;i<=5;i++)out+=i<=n?'★':'☆';return out;}

function openNewDepartmentAccess(){

function renderAccesses(){if(!ACCESS_DATA){loadAccesses();return;}var q=(document.getElementById('accessSearch').value||'').toLowerCase().trim(),f=document.getElementById('accessStatusFilter').value,items=(ACCESS_DATA.items||[]).filter(function(i){var text=((i.lojaCodigo||'')+' '+(i.lojaNome||'')+' '+(i.nome||'')+' '+(i.role||'')+' '+(i.email||'')).toLowerCase();return (!q||text.indexOf(q)>=0)&&(f==='all'||(f==='active'&&i.ativo)||(f==='inactive'&&!i.ativo));});document.getElementById('accessKpis').innerHTML=[[(ACCESS_DATA.items||[]).length,'Acessos cadastrados'],[(ACCESS_DATA.items||[]).filter(function(i){return i.ativo;}).length,'Ativos'],[(ACCESS_DATA.items||[]).filter(function(i){return !i.ativo;}).length,'Inativos'],[(ACCESS_DATA.items||[]).filter(function(i){return i.forcePasswordChange;}).length,'Senha temporária']].map(kpiHtml).join('');document.getElementById('accessTable').innerHTML='<div class="row header"><div>Usuário / Perfil</div><div>Login</div><div>Status</div><div>Senha</div><div>Ações</div></div>'+(items.map(function(i){return '<div class="row actions-row"><div><h4>'+safe((i.lojaCodigo?i.lojaCodigo+' · ':'')+(i.lojaNome||i.nome||'Usuário'))+'</h4><div class="muted">'+safe((i.role||'').toUpperCase())+'</div></div><div class="muted">'+safe(i.email)+'</div><div><span class="access-pill '+(i.ativo?'active':'inactive')+'">'+(i.ativo?'Ativo':'Inativo')+'</span></div><div class="muted">'+(i.forcePasswordChange?'Temporária':'Definida')+'</div><div class="actions"><button class="btn soft" onclick="openResetAccessPassword(\''+safeJs(i.authUserId)+'\')">Redefinir senha</button><button class="btn '+(i.ativo?'danger':'soft')+'" onclick="toggleAccess(\''+safeJs(i.id)+'\','+(!i.ativo)+')">'+(i.ativo?'Desativar':'Ativar')+'</button></div></div>';}).join('')||'<div class="empty">Nenhum acesso cadastrado.</div>');}
function openUnifiedAccess(){
 var options=(APP_DATA.stores||[]).map(function(st){return '<option value="'+safe(st.id)+'">'+safe((st.codigo?st.codigo+' · ':'')+st.nome)+'</option>';}).join('');
 var body='<div><label class="label">Perfil de acesso</label><select id="accessRole" class="select" onchange="document.getElementById(\'accessStoreGroup\').style.display=this.value===\'loja\'?\'block\':\'none\';document.getElementById(\'accessNameGroup\').style.display=this.value===\'loja\'?\'none\':\'block\'"><option value="loja">Loja</option><option value="marketing">Marketing</option><option value="rh">RH</option><option value="qualidade">Qualidade</option><option value="treinamento">Treinamento</option><option value="comercial">Comercial</option><option value="growth">Growth</option><option value="ti">TI</option></select></div>'+
 '<div id="accessStoreGroup" style="margin-top:12px"><label class="label">Loja</label><select id="accessStore" class="select"><option value="">Selecione</option>'+options+'</select></div>'+
 '<div id="accessNameGroup" style="display:none;margin-top:12px"><label class="label">Nome do usuário</label><input id="accessName" class="field"></div>'+
 '<div style="margin-top:12px"><label class="label">E-mail de login</label><input id="accessEmail" class="field" type="email"></div>'+
 '<div style="margin-top:12px"><label class="label">Senha temporária</label><input id="accessPassword" class="field" type="password" placeholder="Mínimo de 8 caracteres"><div class="temporary-password-note">O usuário deverá alterar a senha no primeiro acesso.</div></div>';
 openGeneric('Usuários & Acessos','Criar usuário',body,function(){
  var payload={role:document.getElementById('accessRole').value,lojaId:document.getElementById('accessStore').value,nome:document.getElementById('accessName').value.trim(),email:document.getElementById('accessEmail').value.trim(),password:document.getElementById('accessPassword').value};
  if(!payload.email||payload.password.length<8||(payload.role==='loja'?!payload.lojaId:!payload.nome)){showToast('Preencha todos os campos obrigatórios.');return;}
  setBusy('genericSaveBtn',true,'Criando...');
  google.script.run.withSuccessHandler(function(){setBusy('genericSaveBtn',false,'Salvar');closeModal('genericModal');showToast('Usuário criado.');loadAccesses();})
  .withFailureHandler(function(err){setBusy('genericSaveBtn',false,'Salvar');serverError(err);}).createUnifiedAccess(payload);
 });
}
function openResetAccessPassword(authUserId){if(!authUserId){showToast('Este acesso ainda não possui usuário Auth vinculado.');return;}var body='<label class="label">Nova senha temporária</label><input id="resetAccessPassword" class="field" type="password" placeholder="Mínimo de 8 caracteres"><div class="temporary-password-note">A loja precisará trocar essa senha no próximo acesso.</div>';openGeneric('Acessos','Redefinir senha',body,function(){var password=document.getElementById('resetAccessPassword').value;if(password.length<8){showToast('A senha deve ter pelo menos 8 caracteres.');return;}setBusy('genericSaveBtn',true,'Salvando...');google.script.run.withSuccessHandler(function(){setBusy('genericSaveBtn',false,'Salvar');closeModal('genericModal');showToast('Senha temporária redefinida.');loadAccesses();}).withFailureHandler(function(e){setBusy('genericSaveBtn',false,'Salvar');serverError(e);}).resetStoreAccessPassword({authUserId:authUserId,password:password});});}
function toggleAccess(userId,ativo){var label=ativo?'ativar':'desativar';if(!confirm('Deseja '+label+' este acesso?'))return;google.script.run.withSuccessHandler(function(){showToast('Acesso atualizado.');loadAccesses();}).withFailureHandler(serverError).setStoreAccessActive({userId:userId,ativo:ativo});}

function sameLocalDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function dayKeyLocal(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function uniqueValues(arr){var m={};(arr||[]).forEach(function(v){if(v)m[String(v)]=1;});return Object.keys(m);}

function readSheetFile(file,onSuccess,onError){var reader=new FileReader();reader.onload=function(e){try{var rows=[],sheet='Planilha 1';if(typeof XLSX!=='undefined'){var wb=XLSX.read(e.target.result,{type:'array',cellDates:true});sheet=wb.SheetNames[0]||sheet;rows=XLSX.utils.sheet_to_json(wb.Sheets[sheet],{header:1,defval:'',raw:false});var tabs=wb.SheetNames.map(function(name){var data=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false});return {name:name,rows:data.length,columns:Math.max.apply(null,[0].concat(data.slice(0,20).map(function(row){return row.length;}))),sample:data.slice(0,5)};});}else{var text=new TextDecoder('utf-8').decode(e.target.result),sep=file.name.toLowerCase().endsWith('.tsv')?'\t':(text.split(/\r?\n/)[0].indexOf(';')>=0?';':',');rows=parseDelimited(text,sep);}onSuccess(rows,{fileName:file.name,sheetName:sheet,sheets:typeof tabs==='undefined'?[]:tabs});}catch(err){onError(err);}};reader.onerror=function(){onError(new Error('Falha ao ler o arquivo.'));};reader.readAsArrayBuffer(file);}
function parseDelimited(text,sep){var out=[],row=[],v='',q=false;for(var i=0;i<text.length;i++){var c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){v+='"';i++;}else q=!q;}else if(c===sep&&!q){row.push(v);v='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(v);out.push(row);row=[];v='';}else v+=c;}if(v!==''||row.length){row.push(v);out.push(row);}return out;}
function inferFieldType(header,values){var h=String(header||'').toLowerCase();if(/data|prazo|vencimento|dia/.test(h))return'date';if(/quant|qtd|número|numero|valor|preço|preco|total/.test(h))return'number';var vals=(values||[]).map(function(v){return String(v||'').trim().toLowerCase();}).filter(Boolean);if(vals.length&&vals.every(function(v){return ['sim','não','nao','yes','no','true','false','s','n'].indexOf(v)>=0;}))return'boolean';var u={};vals.forEach(function(v){u[v]=1;});if(vals.length>=3&&Object.keys(u).length>=2&&Object.keys(u).length<=8)return'select';return'text';}
function normalizeHeader(v){return String(v||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
function findHeader(headers,aliases){for(var i=0;i<headers.length;i++){for(var j=0;j<aliases.length;j++){if(headers[i]===aliases[j]||headers[i].indexOf(aliases[j])>=0)return i;}}return-1;}
function cell(row,i){if(i<0)return'';var v=String(row[i]==null?'':row[i]).trim();return ['#N/A','#REF!','#VALUE!','nan'].indexOf(v)>=0?'':v;}

function setSelectOptions(id,allLabel,values){var el=document.getElementById(id),cur=el.value;el.innerHTML='<option value="all">'+safe(allLabel)+'</option>'+values.map(function(v){return '<option value="'+safe(v)+'">'+safe(v)+'</option>';}).join('');if(values.indexOf(cur)>=0)el.value=cur;}
function kpiHtml(x){return '<div class="kpi"><strong>'+Number(x[0]||0)+'</strong><span>'+safe(x[1])+'</span></div>';}
function typeLabel(t){return String(t||'').toLowerCase()==='campanha'?'Campanha':String(t||'').toLowerCase()==='comunicado'?'Comunicado':'Demanda';}
function timelineLabel(s){return ({draft:'Rascunho',scheduled:'Agendada',active:'Em andamento',due_today:'Vence hoje',late:'Em atraso',completed:'Concluída',closed:'Encerrada'})[s]||'Em andamento';}
function responseStatusLabel(s){return ({respondido:'Aguardando análise',aprovada:'Aprovada',ajuste_necessario:'Ajuste necessário',reprovada:'Reprovada'})[s]||s||'Aguardando análise';}
function fieldTypeLabel(t){return ({text:'Texto curto',textarea:'Texto longo',number:'Número',boolean:'Sim / Não',date:'Data',select:'Lista de opções'})[t]||'Texto curto';}
function hasReminder(arr,tipo){return (arr||[]).some(function(r){return typeof r==='string'?r===tipo:String((r||{}).tipo||'')===tipo&&r.ativo!==false;});}
function formatAnswer(v){if(v===null||v===undefined||v==='')return'—';if(typeof v==='object')return JSON.stringify(v);return String(v);}
function dateKey(v){var d=new Date(v);if(isNaN(d.getTime()))return'9999';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function formatDate(v){var d=new Date(v);return isNaN(d.getTime())?'—':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function formatTime(v){var d=new Date(v);return isNaN(d.getTime())?'':d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}
function formatDateTime(v){if(!v)return'';var d=new Date(v);return isNaN(d.getTime())?'':d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});}
function toLocalInput(v){if(!v)return'';var d=new Date(v);if(isNaN(d.getTime()))return'';var p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes());}
function saudacao(){var h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}
function setBusy(id,busy,text){var el=document.getElementById(id);if(!el)return;el.disabled=busy;if(text)el.textContent=text;}
function showToast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},3200);}
function serverError(error){
  var msg=error&&error.message?error.message:String(error);
  if(AUTH_MODE==='store'&&/sessão|session|jwt|token|expir/i.test(msg)){clearStoreSession();showStoreLogin();showToast('Sua sessão expirou. Entre novamente.');return;}
  showToast(msg);
}

function safeJs(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,' ');}
function safe(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function showError(message){document.getElementById('loading').style.display='none';document.getElementById('app').style.display='none';var b=document.getElementById('errorBox');b.style.display='block';b.innerHTML='<h2>Bacio Conecta</h2><p><strong>Não foi possível carregar o aplicativo.</strong></p><p>'+safe(message)+'</p>';}
function renderCentralOperations(){var a=document.getElementById('centralApprovalArea');if(a)a.style.display=CURRENT_ROLE==='loja'?'none':'block';}
</script>
